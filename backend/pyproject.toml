# ============================================================
# CoolAI 智能业务平台 - 项目配置
# ============================================================
#
# 项目名称：CoolAI
# 项目描述：综合性的AI业务平台
# 版本：1.0.0
#
# 主要功能：
# 1. AI Agent 智能代理
# 2. RAG 知识库增强
# 3. TTS 文字转语音
# 4. 声音克隆
#
# 技术栈：FastAPI + LangChain + PostgreSQL + Milvus
#
# Author: CoolAI Team
# Date: 2026-05-13
# ============================================================

[project]
name = "coolai-platform"
version = "1.0.0"
description = "CoolAI智能业务平台 - 综合AI能力中台"
readme = "README.md"
requires-python = ">=3.10"

authors = [
    {name = "CoolAI Team", email = "team@coolai.com"}
]

license = {text = "MIT"}

keywords = [
    "ai", "langchain", "rag", "tts", "voice-clone",
    "fastapi", "machine-learning", "nlp"
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.1",
    "pydantic>=2.6.3",
    "pydantic-settings>=2.2.1",
    "asyncpg>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.27",
    "redis>=5.0.1",
    "pymilvus>=2.3.7",
    "langchain>=0.1.17",
    "openai>=1.17.1",
    "edge-tts>=6.1.12",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
    "minio>=7.2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.5",
    "pytest-cov>=4.1.0",
    "black>=24.3.0",
    "ruff>=0.3.4",
    "mypy>=1.9.0",
]

[project.urls]
Homepage = "https://github.com/coolai/coolai"
Documentation = "https://docs.coolai.com"
Repository = "https://github.com/coolai/coolai.git"
Issues = "https://github.com/coolai/coolai/issues"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.black]
line-length = 100
target-version = ["py310", "py311"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py310"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["app"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
