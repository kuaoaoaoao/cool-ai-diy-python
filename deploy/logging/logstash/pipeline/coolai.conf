# ============================================================
# Logstash Pipeline 配置 - CoolAI 日志处理
# ============================================================
# 
# 从Filebeat接收日志，处理后写入Elasticsearch
# 
# Author: CoolAI Team
# Date: 2026-05-13
# ============================================================

input {
  beats {
    port => 5044
    host => "0.0.0.0"
  }
}

filter {
  # 解析后端Python日志格式
  # 格式: 2026-05-13 10:00:00 - module - LEVEL - message
  if [service] == "coolai-backend" {
    grok {
      match => {
        "message" => "%{TIMESTAMP_ISO8601:timestamp} - %{DATA:module} - %{WORD:log_level} - %{GREEDYDATA:log_message}"
      }
      overwrite => ["message"]
    }
    
    # 设置日志级别字段
    mutate {
      uppercase => ["log_level"]
    }
    
    # 提取错误堆栈
    if [log_level] == "ERROR" or [log_level] == "CRITICAL" {
      mutate {
        add_field => { "alert" => "true" }
      }
    }
  }
  
  # 解析Nginx访问日志
  if [service] == "coolai-nginx" and [log_type] == "access" {
    grok {
      match => {
        "message" => '%{IP:client_ip} - - \[%{HTTPDATE:timestamp}\] "%{WORD:method} %{URIPATHPARAM:url} HTTP/%{NUMBER:http_version}" %{NUMBER:status_code} %{NUMBER:bytes} "%{DATA:referrer}" "%{DATA:user_agent}"'
      }
      overwrite => ["message"]
    }
    
    # 转换数值字段
    mutate {
      convert => {
        "status_code" => "integer"
        "bytes" => "integer"
      }
    }
    
    # 标记慢请求
    if [bytes] and [bytes] > 1000000 {
      mutate {
        add_field => { "slow_request" => "true" }
      }
    }
  }
  
  # 添加时间戳
  date {
    match => ["timestamp", "ISO8601", "dd/MMM/yyyy:HH:mm:ss Z"]
    target => "@timestamp"
  }
  
  # 移除不必要的字段
  mutate {
    remove_field => ["@version", "tags"]
  }
}

output {
  # 输出到Elasticsearch
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "coolai-logs-%{+YYYY.MM.dd}"
    # 使用ILM自动管理索引生命周期
    ilm_enabled => true
    ilm_rollover_alias => "coolai-logs"
    ilm_pattern => "{now/d}-000001"
    ilm_policy => "coolai-log-policy"
  }
}
