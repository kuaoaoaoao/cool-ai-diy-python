# ============================================================
# Prometheus 配置
# ============================================================
#
# Prometheus 监控配置
# 负责收集和存储时序数据
#
# 部署：docker-compose up -d prometheus
# 访问：http://localhost:9090
#
# Author: CoolAI Team
# Date: 2026-05-13
# ============================================================

global:
  # 全局采集间隔
  scrape_interval: 15s
  # 评估规则间隔
  evaluation_interval: 15s

  # 标签：所有时间序列和告警添加这些标签
  external_labels:
    cluster: 'coolai'
    environment: 'production'

# Alertmanager 配置
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

# 规则文件
rule_files:
  - /etc/prometheus/rules/*.yml

# 采集配置
scrape_configs:
  # ============================================================
  # Prometheus 自身监控
  # ============================================================
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    metrics_path: /metrics

  # ============================================================
  # 后端API服务
  # ============================================================
  - job_name: 'coolai-backend'
    static_configs:
      - targets: ['backend:8000']
    metrics_path: /metrics
    scrape_interval: 10s
    scrape_timeout: 5s

  # ============================================================
  # PostgreSQL 数据库
  # ============================================================
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']

  # ============================================================
  # Redis
  # ============================================================
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']

  # ============================================================
  # Nginx
  # ============================================================
  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx-exporter:9113']

  # ============================================================
  # Docker 容器指标
  # ============================================================
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # ============================================================
  # Milvus 向量数据库
  # ============================================================
  - job_name: 'milvus'
    static_configs:
      - targets: ['milvus:9091']
