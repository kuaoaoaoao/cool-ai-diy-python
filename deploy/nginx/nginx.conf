# ============================================================
# Nginx 反向代理配置
# ============================================================
#
# Nginx 配置
# - 反向代理到后端服务
# - 静态文件服务
# - SSL终止
# - 速率限制
#
# Author: CoolAI Team
# Date: 2026-05-13
# ============================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    # ============================================================
    # 基础配置
    # ============================================================
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip压缩
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # ============================================================
    # 上游服务器
    # ============================================================
    upstream backend {
        server backend:8000;
        keepalive 32;
    }

    upstream frontend {
        server frontend:3000;
        keepalive 16;
    }

    # ============================================================
    # 速率限制
    # ============================================================
    # 限制IP连接数
    limit_conn_zone $binary_remote_addr zone=addr:10m;
    
    # 限制IP请求频率
    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/s;

    # ============================================================
    # 后端API服务
    # ============================================================
    server {
        listen 80;
        server_name api.coolai.com;

        # 健康检查
        location /health {
            return 200 'OK';
            add_header Content-Type text/plain;
        }

        # API代理
        location /api/ {
            # 速率限制
            limit_req zone=api burst=200 nodelay;
            
            # 反向代理
            proxy_pass http://backend;
            proxy_http_version 1.1;
            
            # 设置代理头
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket支持
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # 超时设置
            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            # 缓冲设置
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
        }

        # 监控端点
        location /metrics {
            proxy_pass http://backend:8000/metrics;
            auth_basic "Prometheus";
            auth_basic_user_file /etc/nginx/.htpasswd;
        }

        # 访问日志
        access_log /var/log/nginx/api.access.log main;
    }

    # ============================================================
    # 前端Web服务
    # ============================================================
    server {
        listen 80;
        server_name www.coolai.com coolai.com;

        root /usr/share/nginx/html;
        index index.html;

        # 静态资源缓存
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # SPA路由支持
        location / {
            try_files $uri $uri/ /index.html;
        }

        # 访问日志
        access_log /var/log/nginx/web.access.log main;
    }

    # ============================================================
    # Grafana 监控面板
    # ============================================================
    server {
        listen 80;
        server_name grafana.coolai.com;

        location / {
            proxy_pass http://grafana:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    # ============================================================
    # Prometheus 监控
    # ============================================================
    server {
        listen 80;
        server_name prometheus.coolai.com;

        # 认证
        auth_basic "Prometheus";
        auth_basic_user_file /etc/nginx/.htpasswd;

        location / {
            proxy_pass http://prometheus:9090;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
    }
}
